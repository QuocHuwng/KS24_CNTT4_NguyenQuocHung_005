spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: vehicle-service
              uri: lb://vehicle-service
              predicates:
                - Path=/api/v1/vehicles/**
            - id: rental-service
              uri: lb://rental-service
              predicates:
                - Path=/api/v1/rentals/**

server:
  port: 8080

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/